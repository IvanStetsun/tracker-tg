<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Трекер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --f-bg: #f2f2f7; --f-card: #ffffff; --f-text: #000000; --f-hint: #8e8e93; --f-accent: #0a84ff; --f-accent-text: #ffffff; --f-danger: #ff3b30;
    --bg: var(--tg-theme-secondary-bg-color, var(--f-bg));
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--f-card)));
    --text: var(--tg-theme-text-color, var(--f-text));
    --hint: var(--tg-theme-hint-color, var(--f-hint));
    --accent: var(--tg-theme-button-color, var(--f-accent));
    --accent-text: var(--tg-theme-button-text-color, var(--f-accent-text));
    --danger: var(--tg-theme-destructive-text-color, var(--f-danger));
    --sep: rgba(127, 127, 127, 0.18);
    --stop: #ff3b30; --warn: #ff9f0a; --kw: #2f6feb; --ke: #f08a24;
    --safe-bottom: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
  }
  @media (prefers-color-scheme: dark) { :root { --f-bg: #000; --f-card: #1c1c1e; --f-text: #fff; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  input, select, button { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  .screen { padding: 16px 16px calc(24px + var(--safe-bottom)); max-width: 560px; margin: 0 auto; }
  .screen.with-bar { padding-bottom: calc(112px + var(--safe-bottom)); }

  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 4px 0 14px; }
  .date { color: var(--hint); font-size: 14px; }
  .today { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .back { border: 0; background: none; color: var(--accent); font-size: 16px; padding: 4px 0 8px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .pill { border: 0; background: var(--card); padding: 9px 14px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--accent); }
  .pill.on { background: var(--accent); color: var(--accent-text); }

  .banner { display: flex; gap: 12px; align-items: center; padding: 14px; margin-bottom: 16px; border-radius: 18px;
    background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .banner b { display: block; font-size: 15px; }
  .banner span { color: var(--hint); font-size: 13px; }
  .banner button { margin-left: auto; flex: none; border: 0; border-radius: 12px; padding: 8px 12px;
    background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); font-weight: 600; }

  .section-title { color: var(--hint); font-size: 13px; text-transform: uppercase; letter-spacing: .02em; margin: 18px 16px 8px; }

  /* Project rows */
  .prow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 14px 14px 12px; border: 0; border-radius: 18px;
    background: var(--card); margin-bottom: 10px; text-align: left; transition: transform .15s, background .25s; }
  .prow:active { transform: scale(.98); }
  .prow .stripe { width: 6px; height: 40px; border-radius: 3px; background: var(--c); flex: none; }
  .prow .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .sub { font-size: 13px; color: var(--hint); }
  .prow .grow { flex: 1; min-width: 0; }
  .prow .val { font-weight: 600; white-space: nowrap; }
  .prow.running { background: color-mix(in srgb, var(--c) 20%, var(--card)); }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; animation: pulse 1.2s ease-in-out infinite; }
  .chev { color: var(--hint); }

  /* Task rows */
  .task { background: var(--card); border-radius: 18px; padding: 12px 14px 14px; margin-bottom: 10px; }
  .task .tname { font-weight: 600; margin-bottom: 10px; }
  .task.edit { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; text-align: left; padding: 16px; }
  .task.edit .tname { margin: 0; flex: 1; }
  .tbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tb { position: relative; display: flex; flex-direction: column; align-items: flex-start; text-align: left; border: 0; border-radius: 14px;
    padding: 10px 12px; background: color-mix(in srgb, var(--kc) 14%, transparent); transition: transform .15s, background .25s, box-shadow .25s; }
  .tb:active { transform: scale(.96); }
  .tb.w { --kc: var(--kw); }
  .tb.e { --kc: var(--ke); }
  .tb .lbl { font-size: 12px; opacity: .8; }
  .tb .tv { font-size: 18px; font-weight: 700; }
  .tb.on { background: var(--kc); color: #fff; box-shadow: 0 8px 18px color-mix(in srgb, var(--kc) 40%, transparent); }
  .tb.on::after { content: ""; position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.7); } 50% { opacity: 1; transform: scale(1); } }

  .link { display: block; border: 0; background: none; color: var(--accent); padding: 12px 4px; font-size: 15px; }
  .link.danger { color: var(--danger); }
  .hint { color: var(--hint); font-size: 13px; margin: 12px 4px 0; }

  /* Running bar */
  .bar { position: fixed; left: 12px; right: 12px; bottom: calc(10px + var(--safe-bottom)); max-width: 536px; margin: 0 auto; z-index: 5;
    display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 28px;
    background: color-mix(in srgb, var(--card) 88%, transparent); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: 0 8px 28px rgba(0,0,0,.16); animation: rise .28s ease; }
  .bar .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .bar .info { min-width: 0; flex: 1; border: 0; background: none; text-align: left; padding: 0; }
  .bar .pname { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .psub { font-size: 12px; color: var(--hint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .ptime { font-size: 20px; font-weight: 700; }
  .stop { flex: none; border: 0; border-radius: 999px; padding: 15px 22px; background: var(--stop); color: #fff; font-weight: 700; font-size: 17px; transition: transform .15s; }
  .stop:active { transform: scale(.94); }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* History + lists */
  .switcher { display: flex; align-items: center; justify-content: space-between; margin: 0 0 14px; }
  .switcher button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--card); font-size: 20px; color: var(--accent); }
  .switcher button:disabled { opacity: .3; }
  .switcher .title { text-align: center; }
  .switcher .title b { display: block; font-size: 17px; }
  .switcher .title span { color: var(--hint); font-size: 13px; }
  .group { background: var(--card); border-radius: 16px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; border: 0; background: none; text-align: left; border-top: 1px solid var(--sep); }
  .group > .row:first-child { border-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .grow > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { color: var(--hint); font-size: 14px; }
  .row .val { color: var(--hint); white-space: nowrap; }
  .row.total { font-weight: 700; }
  .row.total .val { color: var(--text); }
  .estripe { width: 4px; height: 36px; border-radius: 2px; flex: none; }
  .empty { padding: 16px; color: var(--hint); }
  .primary { display: block; width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 16px; }
  .primary:disabled { opacity: .5; }

  /* Sheets */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); animation: fade .2s ease; z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; z-index: 11; max-height: 90vh; overflow-y: auto;
    padding: 8px 16px calc(20px + var(--safe-bottom)); background: var(--bg); border-radius: 22px 22px 0 0; animation: up .25s ease; -webkit-user-select: text; user-select: text; }
  .sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--sep); margin: 4px auto 10px; }
  .sheet h2 { font-size: 18px; text-align: center; margin: 0 0 14px; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--sep); }
  .group > .field:first-child { border-top: 0; }
  .field input, .field select { border: 0; background: color-mix(in srgb, var(--hint) 14%, transparent); border-radius: 10px; padding: 8px 10px; min-width: 0; max-width: 62%; text-align: right; }
  .field input[type=text] { text-align: left; flex: 1; max-width: none; }
  .note { color: var(--hint); font-size: 13px; margin: 8px 16px 0; }
  .note.err { color: var(--danger); }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .actions button { flex: 1; padding: 14px; border: 0; border-radius: 14px; font-weight: 600; }
  .btn-cancel { background: var(--card); }
  .btn-save { background: var(--accent); color: var(--accent-text); }
  .btn-save:disabled { opacity: .4; }
  .btn-danger { display: block; width: 100%; margin-top: 10px; padding: 14px; border: 0; border-radius: 14px; background: var(--card); color: var(--danger); font-weight: 600; }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; padding: 14px 16px; }
  .swatch { aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; }
  .swatch.on { border-color: var(--text); }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(100px + var(--safe-bottom)); max-width: 420px; margin: 0 auto; z-index: 20;
    padding: 12px 16px; border-radius: 14px; background: rgba(40,40,40,.95); color: #fff; font-size: 14px; text-align: center; animation: rise .25s ease; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } }
</style>
</head>
<body>

<main id="app" class="screen"></main>

<div class="bar" id="bar" hidden>
  <span class="dot" id="bar-dot"></span>
  <button class="info" id="bar-info">
    <div class="pname" id="bar-name"></div>
    <div class="psub" id="bar-sub"></div>
  </button>
  <div class="ptime num" data-live="bar"></div>
  <button class="stop" id="bar-stop">■ Стоп</button>
</div>

<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';

// Must match version.txt. A mismatch means this page came from a stale cache, so it reloads itself.
const APP_VERSION = '2026-10-08.4';

function checkForUpdate() {
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
    .then((r) => (r.ok ? r.text() : ''))
    .then((text) => {
      const latest = text.trim();
      if (!latest || latest === APP_VERSION) return;
      try {
        if (sessionStorage.getItem('tracker-update') === latest) return;   // never loop
        sessionStorage.setItem('tracker-update', latest);
      } catch (e) { return; }
      const url = new URL(location.href);
      url.searchParams.set('v', latest);   // new URL = fresh download; the hash keeps Telegram's launch data
      location.replace(url.href);
    })
    .catch(() => {});
}

// ---------- Telegram ----------
const W = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(W && W.initData);
const supports = (v) => inTelegram && W.isVersionAtLeast && W.isVersionAtLeast(v);
const tgName = () => (W && W.initDataUnsafe && W.initDataUnsafe.user && W.initDataUnsafe.user.first_name) || '';

function haptic(kind) {
  if (!supports('6.1')) return;
  if (kind === 'success' || kind === 'warning') W.HapticFeedback.notificationOccurred(kind);
  else W.HapticFeedback.impactOccurred(kind || 'light');
}

// ---------- Storage: Telegram CloudStorage + local cache ----------
const LOCAL_PREFIX = 'tracker2:';
const Store = {
  cloud: supports('6.9') ? W.CloudStorage : null,
  localGet(key) { try { return localStorage.getItem(LOCAL_PREFIX + key); } catch (e) { return null; } },
  localSet(key, value) { try { localStorage.setItem(LOCAL_PREFIX + key, value); } catch (e) {} },
  localRemove(key) { try { localStorage.removeItem(LOCAL_PREFIX + key); } catch (e) {} },
  getMany(keys) {
    return new Promise((resolve) => {
      const local = () => Object.fromEntries(keys.map((k) => [k, Store.localGet(k)]));
      if (!Store.cloud || !keys.length) return resolve(local());
      Store.cloud.getItems(keys, (err, values) => {
        if (err || !values) return resolve(local());
        const out = {};
        for (const k of keys) {
          out[k] = values[k] ? values[k] : Store.localGet(k);
          if (values[k]) Store.localSet(k, values[k]);
        }
        resolve(out);
      });
    });
  },
  set(key, value) {
    Store.localSet(key, value);
    if (Store.cloud) Store.cloud.setItem(key, value, (err) => { if (err) { console.warn('CloudStorage', err); toast('Не удалось сохранить в облако Telegram'); } });
  },
  remove(key) {
    Store.localRemove(key);
    if (Store.cloud) Store.cloud.removeItem(key, () => {});
  },
};

// ---------- Data model ----------
// meta:     { order:[projectId], next:int, run:{t,k,s}|null, name, role }
// project:  key "p<id>" -> { n:name, c:colorIndex, t:[[taskId, name], ...] }
// day:      key "eYYYYMMDD" -> [[taskId, kind(0 work / 1 edits), offsetSec, durationSec], ...] (offset from local midnight)
const COLORS = ['#0A84FF', '#FF9F0A', '#30D158', '#BF5AF2', '#FF375F', '#40C8E0',
                '#5E5CE6', '#FF453A', '#E5B800', '#2FB8A8', '#AC8E68', '#64D2FF'];
const KIND = ['Работа', 'Правки'];
const DEFAULT_TASKS = ['Бриф / постановка задачі', 'Контент-план', 'Клієнтська комунікація', 'Звіт', 'Стратегія', 'Координація команди', 'Інше'];
const FORGOTTEN_AFTER = 8 * 3600 * 1000;

let meta = { order: [], next: 1, run: null, name: '', role: 'Лід' };
const projects = new Map();   // id -> { id, n, c, t:[[tid,name]] }
const taskIndex = new Map();  // tid -> { pid, name }
const days = new Map();       // key -> [{t,k,s,e}] (absolute ms)
const loadingDays = new Set();

const pad = (n) => String(n).padStart(2, '0');
const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayKey = (d) => `e${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
const dayFromKey = (k) => new Date(+k.slice(1, 5), +k.slice(5, 7) - 1, +k.slice(7, 9));
const parseJSON = (text, fallback) => { try { return text ? JSON.parse(text) : fallback; } catch (e) { return fallback; } };

function rebuildIndex() {
  taskIndex.clear();
  for (const p of projects.values()) for (const [tid, name] of p.t) taskIndex.set(tid, { pid: p.id, name });
}

function saveMeta() { Store.set('meta', JSON.stringify(meta)); }
function saveProject(p) { Store.set('p' + p.id, JSON.stringify({ n: p.n, c: p.c, t: p.t })); rebuildIndex(); }
const newId = () => meta.next++;

function seedDefaults() {
  meta = { order: [], next: 1, run: null, name: tgName(), role: 'Лід' };
  projects.clear();
  for (let i = 0; i < 7; i++) {
    const id = newId();
    const count = i === 6 ? 3 : 7;
    projects.set(id, { id, n: `Проект ${i + 1}`, c: i, t: DEFAULT_TASKS.slice(0, count).map((name) => [newId(), name]) });
    meta.order.push(id);
  }
  rebuildIndex();
  saveMeta();
  for (const p of projects.values()) saveProject(p);
}

async function loadAll() {
  const m = parseJSON((await Store.getMany(['meta'])).meta, null);
  if (!m || !Array.isArray(m.order)) return false;
  meta = Object.assign({ next: 1, run: null, name: '', role: 'Лід' }, m);
  const values = await Store.getMany(meta.order.map((id) => 'p' + id));
  projects.clear();
  meta.order = meta.order.filter((id) => {
    const p = parseJSON(values['p' + id], null);
    if (!p || !Array.isArray(p.t)) return false;
    projects.set(id, { id, n: p.n, c: p.c || 0, t: p.t });
    return true;
  });
  rebuildIndex();
  return true;
}

async function loadDays(keys) {
  const missing = keys.filter((k) => !days.has(k));
  if (!missing.length) return;
  const values = await Store.getMany(missing);
  for (const k of missing) {
    if (days.has(k)) continue;
    const base = dayFromKey(k).getTime();
    const list = parseJSON(values[k], []).map(([t, kind, off, dur]) => ({ t, k: kind, s: base + off * 1000, e: base + (off + dur) * 1000 }));
    days.set(k, list);
  }
}

function saveDay(key) {
  const list = days.get(key) || [];
  list.sort((a, b) => a.s - b.s);
  const base = dayFromKey(key).getTime();
  const json = JSON.stringify(list.map((e) => [e.t, e.k, Math.round((e.s - base) / 1000), Math.round((e.e - e.s) / 1000)]));
  if (json.length > 4000) toast('За этот день слишком много записей — часть может не сохраниться в облаке');
  Store.set(key, json);
}

/** Stores [startMs, endMs) for a task, split at local midnights. */
async function addInterval(t, k, startMs, endMs) {
  const pieces = [];
  let cur = startMs;
  while (cur < endMs) {
    const next = addDays(startOfDay(new Date(cur)), 1).getTime();
    const end = Math.min(endMs, next);
    if (end - cur >= 1000) pieces.push({ key: dayKey(new Date(cur)), entry: { t, k, s: cur, e: end } });
    cur = end;
  }
  const keys = [...new Set(pieces.map((x) => x.key))];
  await loadDays(keys);
  for (const { key, entry } of pieces) days.get(key).push(entry);
  keys.forEach(saveDay);
}

/** All entries of a local day (stored + the running timer clipped to that day). */
function entriesOf(day, now) {
  const from = startOfDay(day).getTime();
  const to = addDays(startOfDay(day), 1).getTime();
  const list = (days.get(dayKey(day)) || []).map((e, idx) => ({ t: e.t, k: e.k, s: e.s, e: e.e, idx }));
  const r = meta.run;
  if (r && r.s < to && now > from) {
    const s = Math.max(r.s, from), e = Math.min(now, to);
    if (e > s) list.push({ t: r.t, k: r.k, s, e, run: true });
  }
  return list.filter((x) => taskIndex.has(x.t)).sort((a, b) => a.s - b.s);
}
const sumOf = (list, pred) => list.reduce((a, x) => (pred(x) ? a + (x.e - x.s) / 1000 : a), 0);

// ---------- Actions ----------
async function startTimer(t, k) {
  const now = Date.now();
  const r = meta.run;
  if (r && r.t === t && r.k === k) {
    await stopAt(now);
    haptic('medium');
  } else {
    if (r) await stopAt(now);
    meta.run = { t, k, s: now };
    saveMeta();
    haptic('heavy');
  }
  render();
}

async function stopAt(endMs) {
  const r = meta.run;
  if (!r) return;
  meta.run = null;
  saveMeta();
  if (taskIndex.has(r.t)) await addInterval(r.t, r.k, r.s, Math.max(endMs, r.s));
}

// ---------- Formatting ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function clock(total) {
  total = Math.max(0, Math.floor(total));
  const h = Math.floor(total / 3600), m = Math.floor(total % 3600 / 60), s = total % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function short(total) {
  const minutes = Math.floor(Math.max(0, total) / 60);
  const h = Math.floor(minutes / 60), m = minutes % 60;
  if (!h) return `${m} мин`;
  return m ? `${h} ч ${m} мин` : `${h} ч`;
}
const hm = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const localInput = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${hm(ms)}`; };
const weekdayDate = (d) => d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
const colorOf = (pid) => COLORS[((projects.get(pid) || {}).c || 0) % COLORS.length];
const taskName = (tid) => (taskIndex.get(tid) || {}).name || 'Задача';
const projectName = (pid) => (projects.get(pid) || {}).n || 'Проект';

let toastTimer = null;
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3500);
}

// ---------- Navigation ----------
let view = 'home';          // home | project | history
let curPid = null;
let editMode = false;
let historyDay = null;
let canAddHome = false;

async function go(next, opts = {}) {
  if (next === 'history') {
    historyDay = startOfDay(opts.day || new Date());
    await loadDays([dayKey(historyDay)]);
  }
  if (next === 'project') { curPid = opts.pid; editMode = !!opts.edit; }
  if (next === 'home') { editMode = false; }
  view = next;
  updateBack();
  render();
  window.scrollTo(0, 0);
}

function updateBack() {
  if (!supports('6.1')) return;
  if (view !== 'home' || closeSheet) W.BackButton.show(); else W.BackButton.hide();
}

function goBack() {
  if (closeSheet) closeSheet();
  else if (view !== 'home') go('home');
}

// ---------- Rendering ----------
function render() {
  const now = Date.now();
  const r = meta.run && taskIndex.has(meta.run.t) ? meta.run : null;
  const app = $('app');
  app.innerHTML = view === 'home' ? homeHtml(r) : view === 'project' ? projectHtml(r) : historyHtml(now);

  $('bar').hidden = !r;
  app.classList.toggle('with-bar', !!r);
  if (r) {
    const info = taskIndex.get(r.t);
    $('bar-dot').style.background = r.k ? 'var(--ke)' : 'var(--kw)';
    $('bar-name').textContent = info.name;
    $('bar-sub').textContent = `${projectName(info.pid)} · ${KIND[r.k]}`;
  }
  renderBanner(now);
  tick();
}

function homeHtml(r) {
  const runPid = r ? taskIndex.get(r.t).pid : null;
  return `
    <div class="top"><div>
      <div class="date">${esc(weekdayDate(new Date()))}</div>
      <div class="today">Сегодня: <span class="num" data-live="today-total"></span></div>
    </div></div>
    <div class="chips">
      <button class="pill" data-act="history">История</button>
      <button class="pill" data-act="excel">Excel</button>
      <button class="pill" data-act="settings">Настройки</button>
    </div>
    <div id="banner-slot"></div>
    <div class="section-title">Проекты</div>
    ${meta.order.map((pid) => {
      const p = projects.get(pid);
      return `<button class="prow${runPid === pid ? ' running' : ''}" data-act="open-project" data-pid="${pid}" style="--c:${colorOf(pid)}">
        <span class="stripe"></span>
        <span class="grow"><div class="nm">${runPid === pid ? '<span class="live-dot"></span>' : ''}${esc(p.n)}</div>
        <div class="sub">${p.t.length} ${plural(p.t.length)}</div></span>
        <span class="val num" data-live="proj:${pid}"></span><span class="chev">›</span>
      </button>`;
    }).join('')}
    <button class="link" data-act="add-project">+ Добавить проект</button>
    <button class="link" data-act="add-home" ${canAddHome ? '' : 'hidden'}>Добавить на экран «Домой»</button>`;
}

function plural(n) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return 'задача';
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return 'задачи';
  return 'задач';
}

function projectHtml(r) {
  const p = projects.get(curPid);
  if (!p) return '';
  const tasks = p.t.map(([tid, name]) => {
    if (editMode) {
      return `<button class="task edit" data-act="edit-task" data-t="${tid}"><span class="tname">${esc(name)}</span><span class="chev">✎</span></button>`;
    }
    return `<div class="task"><div class="tname">${esc(name)}</div><div class="tbtns">${[0, 1].map((k) => `
      <button class="tb ${k ? 'e' : 'w'}${r && r.t === tid && r.k === k ? ' on' : ''}" data-act="timer" data-t="${tid}" data-k="${k}">
        <span class="lbl">${KIND[k]}</span><span class="tv num" data-live="tk:${tid}:${k}"></span>
      </button>`).join('')}</div></div>`;
  }).join('');

  return `
    <button class="back" data-act="back">‹ Проекты</button>
    <div class="top"><div>
      <div class="today" style="color:${colorOf(p.id)}">${esc(p.n)}</div>
      <div class="date">Сегодня: <span class="num" data-live="proj:${p.id}"></span></div>
    </div><button class="pill${editMode ? ' on' : ''}" data-act="toggle-edit">${editMode ? 'Готово' : 'Изменить'}</button></div>
    <div id="banner-slot"></div>
    ${tasks || '<p class="hint">В проекте пока нет задач. Нажмите «Изменить» и добавьте.</p>'}
    ${editMode ? `
      <button class="link" data-act="add-task">+ Добавить задачу</button>
      <button class="link" data-act="edit-project">Название и цвет проекта</button>`
      : '<p class="hint">У каждой задачи два таймера: «Работа» и «Правки». Нажатие на другой таймер переключает счёт.</p>'}`;
}

function historyHtml(now) {
  const day = historyDay;
  const isToday = dayKey(day) === dayKey(new Date(now));
  const yesterday = dayKey(day) === dayKey(addDays(new Date(now), -1));
  const title = isToday ? 'Сегодня' : yesterday ? 'Вчера' : day.toLocaleDateString('ru-RU', { weekday: 'long' });
  const rows = entriesOf(day, now);
  return `
    <button class="back" data-act="back">‹ Назад</button>
    <div class="switcher">
      <button data-act="prev-day" aria-label="Предыдущий день">‹</button>
      <div class="title"><b>${esc(title)}</b><span>${esc(day.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }))}</span></div>
      <button data-act="next-day" aria-label="Следующий день" ${isToday ? 'disabled' : ''}>›</button>
    </div>
    <div class="section-title">Итого за день</div>
    <div class="group">
      ${meta.order.map((pid) => `<div class="row"><span class="estripe" style="background:${colorOf(pid)};height:22px"></span>
        <span class="grow"><div>${esc(projectName(pid))}</div></span><span class="val num" data-live="h-p:${pid}"></span></div>`).join('')}
      <div class="row total"><span class="grow">Всего</span><span class="val num" data-live="h-total"></span></div>
    </div>
    <div class="section-title">Записи</div>
    <div class="group">
      ${rows.length ? rows.map((x) => {
        const info = taskIndex.get(x.t);
        return `<button class="row" data-act="entry" data-i="${x.run ? 'run' : x.idx}">
          <span class="estripe" style="background:${x.k ? 'var(--ke)' : 'var(--kw)'}"></span>
          <span class="grow"><div>${esc(info.name)}</div>
          <div class="sub">${esc(projectName(info.pid))} · ${KIND[x.k]} · ${hm(x.s)}–${x.run ? 'сейчас' : hm(x.e)}</div></span>
          <span class="val num"${x.run ? ' data-live="run-dur"' : ''}>${x.run ? '' : short((x.e - x.s) / 1000)}</span>
        </button>`;
      }).join('') : '<div class="empty">В этот день таймер не запускался.</div>'}
    </div>
    <p class="hint">Нажмите на запись, чтобы поправить время или удалить её.</p>
    <button class="primary" data-act="add-entry">+ Добавить запись</button>`;
}

function renderBanner(now) {
  const slot = $('banner-slot');
  if (!slot) return;
  const r = meta.run;
  if (!r || !taskIndex.has(r.t) || now - r.s <= FORGOTTEN_AFTER) { slot.innerHTML = ''; return; }
  slot.innerHTML = `<div class="banner"><div><b>Таймер идёт уже ${short((now - r.s) / 1000)}</b>
    <span>Забыли выключить? ${esc(taskName(r.t))}</span></div><button data-act="fix-run">Исправить</button></div>`;
}

function tick() {
  const now = Date.now();
  const today = new Date(now);
  const todayKey = dayKey(today);
  if (!days.has(todayKey)) {
    if (!loadingDays.has(todayKey)) { loadingDays.add(todayKey); loadDays([todayKey]).then(() => { loadingDays.delete(todayKey); render(); }); }
    return;
  }
  const te = entriesOf(today, now);
  const he = view === 'history' && historyDay ? entriesOf(historyDay, now) : [];
  const pidOf = (x) => taskIndex.get(x.t).pid;
  const r = meta.run && taskIndex.has(meta.run.t) ? meta.run : null;

  for (const el of document.querySelectorAll('[data-live]')) {
    const [kind, a, b] = el.dataset.live.split(':');
    let text = '';
    if (kind === 'today-total') text = short(sumOf(te, () => true));
    else if (kind === 'proj') text = short(sumOf(te, (x) => pidOf(x) === +a));
    else if (kind === 'tk') {
      const seconds = sumOf(te, (x) => x.t === +a && x.k === +b);
      text = r && r.t === +a && r.k === +b ? clock(seconds) : short(seconds);
    }
    else if (kind === 'bar') text = r ? clock((now - r.s) / 1000) : '';
    else if (kind === 'h-p') text = short(sumOf(he, (x) => pidOf(x) === +a));
    else if (kind === 'h-total') text = short(sumOf(he, () => true));
    else if (kind === 'run-dur') text = r ? short((now - r.s) / 1000) : '';
    if (el.textContent !== text) el.textContent = text;
  }

  const shouldWarn = !!(r && now - r.s > FORGOTTEN_AFTER);
  const slot = $('banner-slot');
  if (slot && shouldWarn !== !!slot.firstChild) renderBanner(now);
  if (!!r !== !$('bar').hidden) render();
}

// ---------- Click handling ----------
$('app').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case 'open-project': return go('project', { pid: +d.pid });
    case 'back': return goBack();
    case 'history': return go('history');
    case 'prev-day': return go('history', { day: addDays(historyDay, -1) });
    case 'next-day': return go('history', { day: addDays(historyDay, 1) });
    case 'excel': return openExport();
    case 'settings': return openSettings();
    case 'timer': return startTimer(+d.t, +d.k);
    case 'toggle-edit': editMode = !editMode; haptic('light'); return render();
    case 'add-project': return addProject();
    case 'add-task': return openTaskSheet(null);
    case 'edit-task': return openTaskSheet(+d.t);
    case 'edit-project': return openProjectSheet(curPid);
    case 'fix-run': return openRunningEditor();
    case 'add-entry': return openEntryEditor(historyDay, null);
    case 'entry': return d.i === 'run' ? openRunningEditor() : openEntryEditor(historyDay, +d.i);
    case 'add-home': return W.addToHomeScreen();
  }
});
$('bar-stop').onclick = async () => { await stopAt(Date.now()); haptic('medium'); render(); };
$('bar-info').onclick = () => {
  const r = meta.run;
  if (r && taskIndex.has(r.t)) go('project', { pid: taskIndex.get(r.t).pid });
};

// ---------- Sheets ----------
let closeSheet = null;

function openSheet(title, html, onMount) {
  const root = $('sheet-root');
  root.innerHTML = `<div class="overlay"></div><div class="sheet" role="dialog" aria-label="${esc(title)}">
    <div class="grab"></div><h2>${esc(title)}</h2>${html}</div>`;
  closeSheet = () => { root.innerHTML = ''; closeSheet = null; updateBack(); };
  root.querySelector('.overlay').onclick = closeSheet;
  updateBack();
  onMount(root.querySelector('.sheet'));
}

function confirmThen(message, action) {
  if (supports('6.2')) W.showConfirm(message, (ok) => { if (ok) action(); });
  else if (window.confirm(message)) action();
}

function swatchesHtml(selected) {
  return COLORS.map((c, i) => `<button class="swatch${i === selected ? ' on' : ''}" data-c="${i}" style="background:${c}" aria-label="Цвет ${i + 1}"></button>`).join('');
}

// Project / task pickers shared by the entry and running-timer editors
function pickerHtml() {
  return `<div class="group">
    <label class="field"><span>Проект</span><select id="f-project">${meta.order.map((id) => `<option value="${id}">${esc(projectName(id))}</option>`).join('')}</select></label>
    <label class="field"><span>Задача</span><select id="f-task"></select></label>
    <label class="field"><span>Тип</span><select id="f-kind">${KIND.map((n, i) => `<option value="${i}">${n}</option>`).join('')}</select></label>
  </div>`;
}
function wirePicker(tid, kind, pidFallback) {
  const info = taskIndex.get(tid);
  const fill = () => {
    const p = projects.get(+$('f-project').value);
    $('f-task').innerHTML = p ? p.t.map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join('') : '';
  };
  $('f-project').value = info ? info.pid : (pidFallback && projects.has(pidFallback) ? pidFallback : meta.order[0]);
  fill();
  if (info) $('f-task').value = tid;
  $('f-kind').value = kind || 0;
  $('f-project').onchange = () => { fill(); $('f-task').dispatchEvent(new Event('input')); };
}

function minutesOf(value) { const [h, m] = value.split(':').map(Number); return h * 60 + m; }

function openEntryEditor(day, index) {
  const dayStart = startOfDay(day).getTime();
  const list = days.get(dayKey(day)) || [];
  const existing = index != null ? list[index] : null;
  const now = Date.now();
  let s, e;
  if (existing) { s = existing.s; e = existing.e; }
  else if (dayKey(day) === dayKey(new Date(now))) { e = now; s = Math.max(dayStart, now - 3600 * 1000); }
  else { s = dayStart + 12 * 3600 * 1000; e = s + 3600 * 1000; }
  const endValue = e >= dayStart + 86400 * 1000 - 500 ? '00:00' : hm(e);

  openSheet(existing ? 'Запись' : 'Новая запись', `
    ${pickerHtml()}
    <div class="group" style="margin-top:12px">
      <label class="field"><span>Начало</span><input type="time" id="f-start" value="${hm(s)}"></label>
      <label class="field"><span>Конец</span><input type="time" id="f-end" value="${endValue}"></label>
    </div>
    <p class="note" id="f-note"></p>
    <div class="actions"><button class="btn-cancel" id="f-cancel">Отмена</button><button class="btn-save" id="f-save">Сохранить</button></div>
    ${existing ? '<button class="btn-danger" id="f-delete">Удалить запись</button>' : ''}`,
  (sheet) => {
    wirePicker(existing ? existing.t : null, existing ? existing.k : 0, curPid);
    const read = () => {
      const st = $('f-start').value, en = $('f-end').value;
      if (!st || !en) return null;
      return {
        start: dayStart + minutesOf(st) * 60000,
        end: en === '00:00' && st !== '00:00' ? dayStart + 86400 * 1000 : dayStart + minutesOf(en) * 60000,
      };
    };
    const validate = () => {
      const v = read();
      let error = '';
      if (!$('f-task').value) error = 'В этом проекте нет задач.';
      else if (!v) error = 'Укажите начало и конец.';
      else if (v.end <= v.start) error = 'Конец должен быть позже начала.';
      else if (v.end > Date.now() + 60000) error = 'Конец не может быть в будущем.';
      $('f-note').classList.toggle('err', !!error);
      $('f-note').textContent = error || `Длительность: ${short((v.end - v.start) / 1000)}. «00:00» в конце — до полуночи.`;
      $('f-save').disabled = !!error;
      return error ? null : v;
    };
    sheet.addEventListener('input', validate);
    validate();
    $('f-cancel').onclick = closeSheet;
    $('f-save').onclick = () => {
      const v = validate();
      if (!v) return;
      const entry = { t: +$('f-task').value, k: +$('f-kind').value, s: v.start, e: v.end };
      const key = dayKey(day);
      if (!days.has(key)) days.set(key, []);
      if (existing) Object.assign(existing, entry); else days.get(key).push(entry);
      saveDay(key);
      haptic('success');
      closeSheet();
      render();
    };
    if (existing) $('f-delete').onclick = () => confirmThen('Удалить запись?', () => {
      days.get(dayKey(day)).splice(index, 1);
      saveDay(dayKey(day));
      haptic('warning');
      closeSheet();
      render();
    });
  });
}

/** Running timer: change task/start, or stop it at an earlier time ("forgot to turn off"). */
function openRunningEditor() {
  const r = meta.run;
  if (!r) return;
  const now = Date.now();
  const suggestedEnd = Math.min(now, r.s + 3600 * 1000);

  openSheet('Идущий таймер', `
    ${pickerHtml()}
    <div class="group" style="margin-top:12px">
      <label class="field"><span>Начало</span><input type="datetime-local" id="r-start" value="${localInput(r.s)}" max="${localInput(now)}"></label>
    </div>
    <div class="actions"><button class="btn-cancel" id="r-cancel">Отмена</button><button class="btn-save" id="r-save">Сохранить</button></div>
    <div class="section-title">Забыли выключить?</div>
    <div class="group">
      <label class="field"><span>Закончили в</span><input type="datetime-local" id="r-end" value="${localInput(suggestedEnd)}" min="${localInput(r.s)}" max="${localInput(now)}"></label>
    </div>
    <p class="note" id="r-note">Таймер остановится, и в истории будет указанное время.</p>
    <button class="primary" id="r-stop">Остановить в это время</button>
    <button class="btn-danger" id="r-discard">Не учитывать этот таймер</button>`,
  () => {
    wirePicker(r.t, r.k, null);
    const showNote = (text) => { $('r-note').textContent = text; $('r-note').classList.add('err'); haptic('warning'); };
    $('r-cancel').onclick = closeSheet;
    $('r-save').onclick = () => {
      const start = new Date($('r-start').value).getTime();
      if (!isFinite(start) || start > Date.now()) return showNote('Начало не может быть в будущем.');
      if (!$('f-task').value) return showNote('Выберите задачу.');
      meta.run = { t: +$('f-task').value, k: +$('f-kind').value, s: start };
      saveMeta();
      haptic('success');
      closeSheet();
      render();
    };
    $('r-stop').onclick = async () => {
      const end = new Date($('r-end').value).getTime();
      const current = meta.run;
      if (!current) return closeSheet();
      if (!isFinite(end) || end <= current.s) return showNote('Время окончания должно быть позже начала.');
      if ($('f-task').value) { current.t = +$('f-task').value; current.k = +$('f-kind').value; }
      await stopAt(Math.min(end, Date.now()));
      haptic('success');
      closeSheet();
      render();
    };
    $('r-discard').onclick = () => confirmThen('Удалить идущий таймер без записи?', () => {
      meta.run = null;
      saveMeta();
      closeSheet();
      render();
    });
  });
}

function addProject() {
  const id = newId();
  const used = new Set([...projects.values()].map((p) => p.c));
  let c = 0;
  while (used.has(c) && c < COLORS.length) c++;
  const p = { id, n: `Проект ${meta.order.length + 1}`, c: c % COLORS.length, t: [] };
  projects.set(id, p);
  meta.order.push(id);
  saveProject(p);
  saveMeta();
  haptic('success');
  go('project', { pid: id, edit: true }).then(() => openProjectSheet(id));
}

function openProjectSheet(pid) {
  const p = projects.get(pid);
  let color = p.c;
  openSheet('Проект', `
    <div class="group"><label class="field"><span>Название</span><input type="text" id="p-name" maxlength="40" value="${esc(p.n)}"></label></div>
    <div class="section-title">Цвет</div>
    <div class="group"><div class="swatches" id="p-colors">${swatchesHtml(color)}</div></div>
    <div class="actions"><button class="btn-cancel" id="p-cancel">Отмена</button><button class="btn-save" id="p-save">Сохранить</button></div>
    <button class="btn-danger" id="p-delete">Удалить проект</button>`,
  () => {
    $('p-colors').onclick = (e) => {
      const sw = e.target.closest('.swatch');
      if (!sw) return;
      color = +sw.dataset.c;
      $('p-colors').querySelectorAll('.swatch').forEach((el) => el.classList.toggle('on', +el.dataset.c === color));
      haptic('light');
    };
    $('p-cancel').onclick = closeSheet;
    $('p-save').onclick = () => {
      const name = $('p-name').value.trim();
      if (!name) return;
      p.n = name; p.c = color;
      saveProject(p);
      haptic('success');
      closeSheet();
      render();
    };
    $('p-delete').onclick = () => confirmThen(`Удалить проект «${p.n}» со всеми задачами? Записанное время пропадёт из Excel.`, async () => {
      if (meta.run && taskIndex.has(meta.run.t) && taskIndex.get(meta.run.t).pid === pid) { meta.run = null; }
      projects.delete(pid);
      meta.order = meta.order.filter((id) => id !== pid);
      Store.remove('p' + pid);
      saveMeta();
      rebuildIndex();
      haptic('warning');
      closeSheet();
      go('home');
    });
  });
}

function openTaskSheet(tid) {
  const p = projects.get(curPid);
  const existing = tid != null ? p.t.find((x) => x[0] === tid) : null;
  openSheet(existing ? 'Задача' : 'Новая задача', `
    <div class="group"><label class="field"><span>Название</span><input type="text" id="t-name" maxlength="60" value="${esc(existing ? existing[1] : '')}" placeholder="Например, Контент-план"></label></div>
    <p class="note">У каждой задачи будет два таймера: «Работа» и «Правки».</p>
    <div class="actions"><button class="btn-cancel" id="t-cancel">Отмена</button><button class="btn-save" id="t-save">Сохранить</button></div>
    ${existing ? '<button class="btn-danger" id="t-delete">Удалить задачу</button>' : ''}`,
  () => {
    $('t-cancel').onclick = closeSheet;
    $('t-save').onclick = () => {
      const name = $('t-name').value.trim();
      if (!name) return;
      if (existing) existing[1] = name; else p.t.push([newId(), name]);
      saveProject(p);
      saveMeta();
      haptic('success');
      closeSheet();
      render();
    };
    if (existing) $('t-delete').onclick = () => confirmThen(`Удалить задачу «${existing[1]}»? Записанное по ней время пропадёт из Excel.`, async () => {
      if (meta.run && meta.run.t === tid) meta.run = null;
      p.t = p.t.filter((x) => x[0] !== tid);
      saveProject(p);
      saveMeta();
      haptic('warning');
      closeSheet();
      render();
    });
  });
}

function openSettings() {
  openSheet('Настройки', `
    <div class="group">
      <label class="field"><span>Имя</span><input type="text" id="s-name" maxlength="30" value="${esc(meta.name)}" placeholder="Для Excel"></label>
      <label class="field"><span>Роль</span><input type="text" id="s-role" maxlength="30" value="${esc(meta.role)}"></label>
    </div>
    <p class="note">Имя и роль попадут в первые колонки Excel-таблицы.</p>
    <div class="actions"><button class="btn-cancel" id="s-cancel">Отмена</button><button class="btn-save" id="s-save">Сохранить</button></div>`,
  () => {
    $('s-cancel').onclick = closeSheet;
    $('s-save').onclick = () => {
      meta.name = $('s-name').value.trim();
      meta.role = $('s-role').value.trim();
      saveMeta();
      haptic('success');
      closeSheet();
    };
  });
}

// ---------- Excel export ----------
let expMonth = null;
let expToken = 0;

const MONTHS_RU = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

function toB64Url(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = '';
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

/**
 * Minutes per task / kind / week for one month. Weeks end on Sunday and start on Monday.
 * Week 1 is the week of the first recorded day of the month (it runs from that day to the
 * first Sunday); the next week starts on the following Monday.
 */
async function buildPayload(first) {
  const y = first.getFullYear(), m = first.getMonth();
  const count = new Date(y, m + 1, 0).getDate();
  const dayList = Array.from({ length: count }, (_, i) => new Date(y, m, i + 1));
  await loadDays(dayList.map(dayKey));
  const now = Date.now();

  let firstIdx = dayList.findIndex((day) => entriesOf(day, now).length > 0);
  if (firstIdx < 0) firstIdx = 0;                                       // nothing recorded yet
  const offset = (dayList[firstIdx].getDay() + 6) % 7;                  // 0 = first day is a Monday
  const weekOf = (i) => Math.floor((i - firstIdx + offset) / 7);        // i = zero-based day index
  const nw = weekOf(count - 1) + 1;
  const wr = Array.from({ length: nw }, (_, w) => {
    const inWeek = dayList.map((_, i) => i).filter((i) => i >= firstIdx && weekOf(i) === w).map((i) => i + 1);
    return inWeek[0] === inWeek[inWeek.length - 1] ? `${inWeek[0]}` : `${inWeek[0]}–${inWeek[inWeek.length - 1]}`;
  });
  const zeros = () => Array(nw).fill(0);

  const acc = new Map();
  dayList.forEach((day, i) => {
    if (i < firstIdx) return;
    const week = weekOf(i);
    for (const x of entriesOf(day, now)) {
      if (!acc.has(x.t)) acc.set(x.t, { w: zeros(), e: zeros() });
      acc.get(x.t)[x.k ? 'e' : 'w'][week] += (x.e - x.s) / 1000;
    }
  });
  const toMin = (a) => a.map((s) => Math.round(s / 60));
  return {
    y, m: m + 1, name: meta.name || tgName(), role: meta.role || '', nw, wr,
    p: meta.order.map((pid) => {
      const p = projects.get(pid);
      return { n: p.n, t: p.t.map(([tid, name]) => { const a = acc.get(tid) || { w: zeros(), e: zeros() }; return { n: name, w: toMin(a.w), e: toMin(a.e) }; }) };
    }),
  };
}

function openExport() {
  const today = new Date();
  expMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  openSheet('Excel-таблица', '<div id="exp-body"></div>', renderExport);
}

async function renderExport() {
  const token = ++expToken;
  const body = $('exp-body');
  if (!body) return;
  const now = new Date();
  const isCurrent = expMonth.getFullYear() === now.getFullYear() && expMonth.getMonth() === now.getMonth();
  const switcher = `<div class="switcher">
    <button id="x-prev" aria-label="Предыдущий месяц">‹</button>
    <div class="title"><b>${MONTHS_RU[expMonth.getMonth()]}</b><span>${expMonth.getFullYear()}</span></div>
    <button id="x-next" aria-label="Следующий месяц" ${isCurrent ? 'disabled' : ''}>›</button></div>`;
  body.innerHTML = `${switcher}<p class="note">Считаю…</p>`;
  const wire = () => {
    $('x-prev').onclick = () => { expMonth = new Date(expMonth.getFullYear(), expMonth.getMonth() - 1, 1); renderExport(); };
    $('x-next').onclick = () => { expMonth = new Date(expMonth.getFullYear(), expMonth.getMonth() + 1, 1); renderExport(); };
  };
  wire();

  const payload = await buildPayload(expMonth);
  if (token !== expToken || !$('exp-body')) return;
  const total = (p) => p.t.reduce((a, t) => a + t.w.reduce((x, y) => x + y, 0) + t.e.reduce((x, y) => x + y, 0), 0);
  const all = payload.p.reduce((a, p) => a + total(p), 0);
  body.innerHTML = `${switcher}
    <div class="group">
      ${payload.p.map((p) => `<div class="row"><span class="grow"><div>${esc(p.n)}</div></span><span class="val num">${short(total(p) * 60)}</span></div>`).join('')}
      <div class="row total"><span class="grow">Всего за месяц</span><span class="val num">${short(all * 60)}</span></div>
    </div>
    <p class="note">Таблица откроется в браузере телефона — там нажмите «Скачать». Время считается в формате ГОД.ХВ, как в вашем образце: по неделям (пн–вс), отдельно «Работа» и «Правки». Неделя 1 — та, в которой в этом месяце появилась первая запись; следующая начинается с понедельника.</p>
    <button class="primary" id="x-open">Открыть таблицу</button>`;
  wire();
  $('x-open').onclick = () => {
    const url = new URL('export.html?v=' + APP_VERSION, location.href).href + '#' + toB64Url(payload);
    if (inTelegram && W.openLink) W.openLink(url); else window.open(url, '_blank');
  };
}

// ---------- Start ----------
async function init() {
  if (inTelegram) {
    W.ready();
    W.expand();
    if (supports('6.1')) {
      W.setHeaderColor('secondary_bg_color');
      W.setBackgroundColor('secondary_bg_color');
      W.BackButton.onClick(goBack);
    }
    if (supports('8.0')) {
      W.checkHomeScreenStatus((status) => { canAddHome = status !== 'added' && status !== 'unsupported'; if (view === 'home') render(); });
    }
  }

  // Instant render from the local cache, then refresh from the Telegram cloud.
  const cachedMeta = parseJSON(Store.localGet('meta'), null);
  if (cachedMeta && Array.isArray(cachedMeta.order)) {
    meta = Object.assign(meta, cachedMeta);
    for (const id of meta.order) {
      const p = parseJSON(Store.localGet('p' + id), null);
      if (p) projects.set(id, { id, n: p.n, c: p.c || 0, t: p.t });
    }
    meta.order = meta.order.filter((id) => projects.has(id));
    rebuildIndex();
    render();
  }

  const found = await loadAll();
  if (!found) {
    if (!projects.size) seedDefaults();
    else { saveMeta(); }
  }
  if (!meta.name) { meta.name = tgName(); }
  await loadDays([dayKey(new Date())]);
  render();

  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  checkForUpdate();
}

init();
</script>
