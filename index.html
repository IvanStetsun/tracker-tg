<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Трекер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --f-bg: #f2f2f7; --f-card: #ffffff; --f-text: #000000; --f-hint: #8e8e93; --f-accent: #0a84ff; --f-accent-text: #ffffff; --f-danger: #ff3b30;
    --bg: var(--tg-theme-secondary-bg-color, var(--f-bg));
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--f-card)));
    --text: var(--tg-theme-text-color, var(--f-text));
    --hint: var(--tg-theme-hint-color, var(--f-hint));
    --accent: var(--tg-theme-button-color, var(--f-accent));
    --accent-text: var(--tg-theme-button-text-color, var(--f-accent-text));
    --danger: var(--tg-theme-destructive-text-color, var(--f-danger));
    --sep: rgba(127, 127, 127, 0.18);
    --stop: #ff3b30; --warn: #ff9f0a; --kw: #2f6feb; --ke: #f08a24;
    --safe-bottom: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
  }
  @media (prefers-color-scheme: dark) { :root { --f-bg: #000; --f-card: #1c1c1e; --f-text: #fff; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  input, select, button { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  .screen { padding: 16px 16px calc(24px + var(--safe-bottom)); max-width: 560px; margin: 0 auto; }
  .screen.with-bar { padding-bottom: calc(112px + var(--safe-bottom)); }

  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 4px 0 14px; }
  .date { color: var(--hint); font-size: 14px; }
  .today { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .back { border: 0; background: none; color: var(--accent); font-size: 16px; padding: 4px 0 8px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .pill { border: 0; background: var(--card); padding: 9px 14px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--accent); }
  .pill.on { background: var(--accent); color: var(--accent-text); }

  .banner { display: flex; gap: 12px; align-items: center; padding: 14px; margin-bottom: 16px; border-radius: 18px;
    background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .banner b { display: block; font-size: 15px; }
  .banner span { color: var(--hint); font-size: 13px; }
  .banner button { margin-left: auto; flex: none; border: 0; border-radius: 12px; padding: 8px 12px;
    background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); font-weight: 600; }

  .section-title { color: var(--hint); font-size: 13px; text-transform: uppercase; letter-spacing: .02em; margin: 18px 16px 8px; }

  /* Project rows */
  .prow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 14px 14px 12px; border: 0; border-radius: 18px;
    background: var(--card); margin-bottom: 10px; text-align: left; transition: transform .15s, background .25s; }
  .prow:active { transform: scale(.98); }
  .prow .stripe { width: 6px; height: 40px; border-radius: 3px; background: var(--c); flex: none; }
  .prow .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .sub { font-size: 13px; color: var(--hint); }
  .prow .grow { flex: 1; min-width: 0; }
  .prow .val { font-weight: 600; white-space: nowrap; }
  .prow.running { background: color-mix(in srgb, var(--c) 20%, var(--card)); }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; animation: pulse 1.2s ease-in-out infinite; }
  .chev { color: var(--hint); }

  /* Task rows */
  .task { background: var(--card); border-radius: 18px; padding: 12px 14px 14px; margin-bottom: 10px; }
  .task .tname { font-weight: 600; margin-bottom: 10px; }
  .task.edit { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; text-align: left; padding: 16px; }
  .task.edit .tname { margin: 0; flex: 1; }
  .tbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tb { position: relative; display: flex; flex-direction: column; align-items: flex-start; text-align: left; border: 0; border-radius: 14px;
    padding: 10px 12px; background: color-mix(in srgb, var(--kc) 14%, transparent); transition: transform .15s, background .25s, box-shadow .25s; }
  .tb:active { transform: scale(.96); }
  .tb.w { --kc: var(--kw); }
  .tb.e { --kc: var(--ke); }
  .tb .lbl { font-size: 12px; opacity: .8; }
  .tb .tv { font-size: 18px; font-weight: 700; }
  .tb.on { background: var(--kc); color: #fff; box-shadow: 0 8px 18px color-mix(in srgb, var(--kc) 40%, transparent); }
  .tb.on::after { content: ""; position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.7); } 50% { opacity: 1; transform: scale(1); } }

  .link { display: block; border: 0; background: none; color: var(--accent); padding: 12px 4px; font-size: 15px; }
  .link.danger { color: var(--danger); }
  .hint { color: var(--hint); font-size: 13px; margin: 12px 4px 0; }

  /* Running bar */
  .bar { position: fixed; left: 12px; right: 12px; bottom: calc(10px + var(--safe-bottom)); max-width: 536px; margin: 0 auto; z-index: 5;
    display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 28px;
    background: color-mix(in srgb, var(--card) 88%, transparent); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: 0 8px 28px rgba(0,0,0,.16); animation: rise .28s ease; }
  .bar .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .bar .info { min-width: 0; flex: 1; border: 0; background: none; text-align: left; padding: 0; }
  .bar .pname { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .psub { font-size: 12px; color: var(--hint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .ptime { font-size: 20px; font-weight: 700; }
  .stop { flex: none; border: 0; border-radius: 999px; padding: 15px 22px; background: var(--stop); color: #fff; font-weight: 700; font-size: 17px; transition: transform .15s; }
  .stop:active { transform: scale(.94); }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* History + lists */
  .switcher { display: flex; align-items: center; justify-content: space-between; margin: 0 0 14px; }
  .switcher button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--card); font-size: 20px; color: var(--accent); }
  .switcher button:disabled { opacity: .3; }
  .switcher .title { text-align: center; }
  .switcher .title b { display: block; font-size: 17px; }
  .switcher .title span { color: var(--hint); font-size: 13px; }
  .group { background: var(--card); border-radius: 16px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; border: 0; background: none; text-align: left; border-top: 1px solid var(--sep); }
  .group > .row:first-child { border-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .grow > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { color: var(--hint); font-size: 14px; }
  .row .val { color: var(--hint); white-space: nowrap; }
  .row.total { font-weight: 700; }
  .row.total .val { color: var(--text); }
  .estripe { width: 4px; height: 36px; border-radius: 2px; flex: none; }
  .empty { padding: 16px; color: var(--hint); }
  .primary { display: block; width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 16px; }
  .primary:disabled { opacity: .5; }

  /* Sheets */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); animation: fade .2s ease; z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; z-index: 11; max-height: 90vh; overflow-y: auto;
    padding: 8px 16px calc(20px + var(--safe-bottom)); background: var(--bg); border-radius: 22px 22px 0 0; animation: up .25s ease; -webkit-user-select: text; user-select: text; }
  .sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--sep); margin: 4px auto 10px; }
  .sheet h2 { font-size: 18px; text-align: center; margin: 0 0 14px; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--sep); }
  .group > .field:first-child { border-top: 0; }
  .field input, .field select { border: 0; background: color-mix(in srgb, var(--hint) 14%, transparent); border-radius: 10px; padding: 8px 10px; min-width: 0; max-width: 62%; text-align: right; }
  .field input[type=text] { text-align: left; flex: 1; max-width: none; }
  .note { color: var(--hint); font-size: 13px; margin: 8px 16px 0; }
  .note.err { color: var(--danger); }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .actions button { flex: 1; padding: 14px; border: 0; border-radius: 14px; font-weight: 600; }
  .btn-cancel { background: var(--card); }
  .btn-save { background: var(--accent); color: var(--accent-text); }
  .btn-save:disabled { opacity: .4; }
  .btn-danger { display: block; width: 100%; margin-top: 10px; padding: 14px; border: 0; border-radius: 14px; background: var(--card); color: var(--danger); font-weight: 600; }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; padding: 14px 16px; }
  .swatch { aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; }
  .swatch.on { border-color: var(--text); }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(100px + var(--safe-bottom)); max-width: 420px; margin: 0 auto; z-index: 20;
    padding: 12px 16px; border-radius: 14px; background: rgba(40,40,40,.95); color: #fff; font-size: 14px; text-align: center; animation: rise .25s ease; }
  .sync { font-size: 12px; color: var(--hint); margin-top: 4px; min-height: 16px; }
  .sync.warn { color: var(--warn); }
  .empty-start { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 10px; }
  .empty-start b { display: block; font-size: 17px; margin-bottom: 4px; }
  .empty-start span { color: var(--hint); font-size: 14px; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } }
</style>
</head>
<body>

<main id="app" class="screen"></main>

<div class="bar" id="bar" hidden>
  <span class="dot" id="bar-dot"></span>
  <button class="info" id="bar-info">
    <div class="pname" id="bar-name"></div>
    <div class="psub" id="bar-sub"></div>
  </button>
  <div class="ptime num" data-live="bar"></div>
  <button class="stop" id="bar-stop">■ Стоп</button>
</div>

<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';

// Must match version.txt. A mismatch means this page came from a stale cache, so it reloads itself.
const APP_VERSION = '2026-10-09.1';

function checkForUpdate() {
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
    .then((r) => (r.ok ? r.text() : ''))
    .then((text) => {
      const latest = text.trim();
      if (!latest || latest === APP_VERSION) return;
      try {
        if (sessionStorage.getItem('tracker-update') === latest) return;   // never loop
        sessionStorage.setItem('tracker-update', latest);
      } catch (e) { return; }
      const url = new URL(location.href);
      url.searchParams.set('v', latest);   // new URL = fresh download; the hash keeps Telegram's launch data
      location.replace(url.href);
    })
    .catch(() => {});
}

// ---------- Telegram ----------
const W = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(W && W.initData);
const supports = (v) => inTelegram && W.isVersionAtLeast && W.isVersionAtLeast(v);
const tgUser = (W && W.initDataUnsafe && W.initDataUnsafe.user) || null;
const tgName = () => (tgUser && tgUser.first_name) || '';

function haptic(kind) {
  if (!supports('6.1')) return;
  if (kind === 'success' || kind === 'warning') W.HapticFeedback.notificationOccurred(kind);
  else W.HapticFeedback.impactOccurred(kind || 'light');
}

// ---------- Settings ----------
const DEFAULT_API = 'https://tracker-bot.stecunivan.workers.dev';
const API_BASE = (() => { try { return localStorage.getItem('tracker:api') || DEFAULT_API; } catch (e) { return DEFAULT_API; } })();
const BOT_USERNAME = 'Timemenedgerbot';
const TEAM_W0 = '2026-10-05';          // Monday of week 1 for the whole team
const PERIOD_WEEKS = 4;
const COLORS = ['#0A84FF', '#FF9F0A', '#30D158', '#BF5AF2', '#FF375F', '#40C8E0',
                '#5E5CE6', '#FF453A', '#E5B800', '#2FB8A8', '#AC8E68', '#64D2FF'];
const KIND = ['Робота', 'Правки'];
const DEFAULT_TASKS = ['Бриф / постановка задачі', 'Контент-план', 'Клієнтська комунікація', 'Звіт', 'Стратегія', 'Координація команди', 'Інше'];
const DEFAULT_PROJECTS = ['Клуб Сиру', 'Канів', "Lel'", 'Ambassador', 'Чорна Карта', 'Аквамарин', 'Філадельфія'];
const TEXTS_TASK = 'Написання текстів';   // the only task of the 7th project
const FORGOTTEN_AFTER = 8 * 3600 * 1000;
const TOMBSTONE_DAYS = 45;                // deleted entries are kept this long so other devices learn about the deletion

// ---------- Data model ----------
// Everything is saved on the phone first (localStorage), then sent to the server when there is internet.
//   meta          { order:[projectId], name, role, run:{t,k,s}|null, u, ru, mig }   u = settings changed, ru = timer changed
//   p<projectId>  { n:name, c:color, r:role, t:[[taskId, name, deleted?]], u, x:deleted? }
//   eYYYYMMDD     [[entryId, taskId, kind(0 work / 1 edits), offsetSec, durationSec, updatedSec, deleted?], ...]
const pad = (n) => String(n).padStart(2, '0');
const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayKey = (d) => `e${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
const dayFromKey = (k) => new Date(+k.slice(1, 5), +k.slice(5, 7) - 1, +k.slice(7, 9));
const parseJSON = (text, fallback) => { try { return text ? JSON.parse(text) : fallback; } catch (e) { return fallback; } };
const nowSec = () => Math.floor(Date.now() / 1000);
const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseIso = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

const defaultMeta = () => ({ order: [], name: '', role: 'Лід', run: null, u: 0, ru: 0, mig: 1 });
let meta = defaultMeta();
const projects = new Map();   // id -> { id, n, c, r, t:[[tid, name, deleted?]], u, x }
const taskIndex = new Map();  // tid -> { pid, name, del }  (deleted tasks stay here: their time still counts)
const days = new Map();       // key -> [{ id, t, k, s, e, u, x }] (absolute ms)

// ---------- Phone storage ----------
const UID = tgUser && tgUser.id ? String(tgUser.id) : 'local';
const LP = `tracker3:${UID}:`;
const Local = {
  get(k) { try { return localStorage.getItem(LP + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(LP + k, v); return true; } catch (e) { return false; } },
  docKeys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(LP) && k[LP.length] !== '_') out.push(k.slice(LP.length));
      }
    } catch (e) {}
    return out;
  },
};

/** Documents changed on the phone that the server has not confirmed yet. Survives closing the app. */
const Outbox = {
  list() { return parseJSON(Local.get('_dirty'), []); },
  add(key) { const l = Outbox.list(); if (!l.includes(key)) { l.push(key); Local.set('_dirty', JSON.stringify(l)); } },
  remove(key) { Local.set('_dirty', JSON.stringify(Outbox.list().filter((k) => k !== key))); },
};
const revOf = (key) => Number(Local.get('_rev:' + key)) || 0;
const setRev = (key, rev) => Local.set('_rev:' + key, String(rev));

let storageWarned = false;
function putDoc(key, value) {
  if (!Local.set(key, value) && !storageWarned) {
    storageWarned = true;
    toast('Пам\'ять браузера переповнена — зміни можуть не зберегтися');
  }
  Outbox.add(key);
  scheduleSync(1500);
}

function rebuildIndex() {
  taskIndex.clear();
  for (const p of projects.values()) {
    for (const [tid, name, del] of p.t) taskIndex.set(tid, { pid: p.id, name, del: !!(del || p.x) });
  }
}
const visibleProjects = () => meta.order.filter((id) => projects.has(id) && !projects.get(id).x);
const liveTasks = (p) => p.t.filter((x) => !x[2]);
const projectDoc = (p) => ({ n: p.n, c: p.c, r: p.r || '', t: p.t, u: p.u || 0, ...(p.x ? { x: 1 } : {}) });

function saveMeta() { meta.u = Date.now(); putDoc('meta', JSON.stringify(meta)); }
function saveRun() { meta.ru = Date.now(); putDoc('meta', JSON.stringify(meta)); }
function saveProject(p) { p.u = Date.now(); putDoc('p' + p.id, JSON.stringify(projectDoc(p))); rebuildIndex(); }

let lastId = 0;
/** Unique across devices: time-based with a random tail. */
function newId() {
  let id = Date.now() * 100 + Math.floor(Math.random() * 100);
  if (id <= lastId) id = lastId + 1;
  lastId = id;
  return id;
}

/** Same id for the same old entry on every device (used when converting data of the previous version). */
function stableId(text) {
  let h1 = 0x811c9dc5, h2 = 7;
  for (let i = 0; i < text.length; i++) {
    const c = text.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
    h2 = (Math.imul(h2, 31) + c) >>> 0;
  }
  return (h1 % 2097152) * 4294967296 + h2;
}

// ---------- Days ----------
const fromStored = (base) => ([id, t, k, off, dur, u, x]) =>
  ({ id, t, k, s: base + off * 1000, e: base + (off + dur) * 1000, u: u || 0, x: x ? 1 : 0 });

function loadDay(key) {
  if (!days.has(key)) days.set(key, parseJSON(Local.get(key), []).map(fromStored(dayFromKey(key).getTime())));
  return days.get(key);
}
async function loadDays(keys) { keys.forEach(loadDay); }

function saveDay(key) {
  const base = dayFromKey(key).getTime();
  const keepSince = nowSec() - TOMBSTONE_DAYS * 86400;
  const list = (days.get(key) || []).filter((e) => !e.x || e.u > keepSince);
  list.sort((a, b) => a.s - b.s);
  days.set(key, list);
  putDoc(key, JSON.stringify(list.map((e) => {
    const row = [e.id, e.t, e.k, Math.round((e.s - base) / 1000), Math.round((e.e - e.s) / 1000), e.u];
    if (e.x) row.push(1);
    return row;
  })));
}

/** Stores [startMs, endMs) for a task, split at local midnights. */
async function addInterval(t, k, startMs, endMs) {
  const keys = new Set();
  let cur = startMs;
  while (cur < endMs) {
    const next = addDays(startOfDay(new Date(cur)), 1).getTime();
    const end = Math.min(endMs, next);
    if (end - cur >= 1000) {
      const key = dayKey(new Date(cur));
      loadDay(key).push({ id: newId(), t, k, s: cur, e: end, u: nowSec(), x: 0 });
      keys.add(key);
    }
    cur = end;
  }
  keys.forEach(saveDay);
}

/** All entries of a local day (stored + the running timer clipped to that day). */
function entriesOf(day, now) {
  const from = startOfDay(day).getTime();
  const to = addDays(startOfDay(day), 1).getTime();
  const list = loadDay(dayKey(day)).map((e, idx) => ({ t: e.t, k: e.k, s: e.s, e: e.e, x: e.x, idx }))
    .filter((e) => !e.x);
  const r = meta.run;
  if (r && r.s < to && now > from) {
    const s = Math.max(r.s, from), e = Math.min(now, to);
    if (e > s) list.push({ t: r.t, k: r.k, s, e, run: true });
  }
  return list.filter((x) => taskIndex.has(x.t)).sort((a, b) => a.s - b.s);
}
const sumOf = (list, pred) => list.reduce((a, x) => (pred(x) ? a + (x.e - x.s) / 1000 : a), 0);

// ---------- Merging (two phones, or a phone that was offline) ----------
/** Combine the phone's and the server's version of one document without losing anything. */
function mergeDoc(key, localStr, serverStr) {
  if (serverStr == null) return localStr;
  if (localStr == null) return serverStr;
  const a = parseJSON(localStr, null), b = parseJSON(serverStr, null);
  if (a == null) return serverStr;
  if (b == null) return localStr;
  let m;
  if (key === 'meta') {
    const base = (a.u || 0) >= (b.u || 0) ? a : b;
    const other = base === a ? b : a;
    const run = (a.ru || 0) >= (b.ru || 0) ? a : b;
    // projects are never removed from the order (deleting only hides them), so the union loses nothing
    const order = (base.order || []).concat((other.order || []).filter((id) => !(base.order || []).includes(id)));
    m = Object.assign({}, base, { order, run: run.run || null, ru: run.ru || 0, mig: Math.max(a.mig || 0, b.mig || 0) });
  } else if (key[0] === 'p') {
    m = (a.u || 0) >= (b.u || 0) ? a : b;
  } else {
    // entries: union by id; for the same entry the newer edit (or deletion) wins
    const byId = new Map();
    for (const row of b) byId.set(row[0], row);
    for (const row of a) {
      const o = byId.get(row[0]);
      if (!o || (row[5] || 0) > (o[5] || 0) || ((row[5] || 0) === (o[5] || 0) && row[6] && !o[6])) byId.set(row[0], row);
    }
    m = [...byId.values()].sort((x, y) => x[3] - y[3]);
  }
  return JSON.stringify(m);
}

/** Put a merged/received document on the phone and into memory (without queueing it again). */
function applyDoc(key, str) {
  Local.set(key, str);
  if (key === 'meta') {
    meta = Object.assign(defaultMeta(), parseJSON(str, {}));
  } else if (key[0] === 'p') {
    const p = parseJSON(str, null);
    if (p && Array.isArray(p.t)) projects.set(+key.slice(1), Object.assign({ id: +key.slice(1) }, p));
    rebuildIndex();
  } else if (days.has(key)) {
    days.delete(key);
    loadDay(key);
  }
}

// ---------- Sync with the server ----------
const SyncState = { status: inTelegram ? 'idle' : 'local', timer: 0, running: false, again: false };

function scheduleSync(delay) {
  clearTimeout(SyncState.timer);
  SyncState.timer = setTimeout(syncNow, delay);
  updateSyncPill();
}

async function api(path, body) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    // text/plain keeps it a "simple" cross-origin request (no preflight), which is faster on bad networks
    const r = await fetch(API_BASE + path, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(body), signal: ctrl.signal,
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.ok) { const err = new Error(data.error || 'HTTP ' + r.status); err.status = r.status; throw err; }
    return data;
  } finally {
    clearTimeout(timer);
  }
}

async function syncNow() {
  if (!inTelegram) { SyncState.status = 'local'; updateSyncPill(); return; }
  if (SyncState.running) { SyncState.again = true; return; }
  if (navigator.onLine === false) { SyncState.status = 'offline'; updateSyncPill(); return; }
  SyncState.running = true;
  SyncState.status = 'syncing';
  updateSyncPill();
  let changed = false;
  try {
    for (let round = 0; round < 6; round++) {
      const push = {}, sent = {};
      for (const key of Outbox.list().slice(0, 80)) {
        const value = Local.get(key);
        if (value == null) { Outbox.remove(key); continue; }
        push[key] = { value, base: revOf(key) };
        sent[key] = value;
      }
      const res = await api('/api/sync', { initData: W.initData, push, since: Number(Local.get('_cursor')) || 0 });

      for (const [key, r] of Object.entries(res.results || {})) {
        if (r.error) { Outbox.remove(key); continue; }
        if (r.conflict) {
          // someone else changed it first: merge, keep what is new on both sides
          const merged = mergeDoc(key, Local.get(key), r.value);
          setRev(key, r.rev);
          if (merged !== Local.get(key)) { applyDoc(key, merged); changed = true; }
          if (merged === r.value) Outbox.remove(key);
        } else {
          setRev(key, r.rev);
          if (Local.get(key) === sent[key]) Outbox.remove(key);
        }
      }
      for (const ch of res.changes || []) {
        if (revOf(ch.key) >= ch.rev) continue;
        const local = Local.get(ch.key);
        const merged = local == null ? ch.value : mergeDoc(ch.key, local, ch.value);
        setRev(ch.key, ch.rev);
        if (merged !== local) { applyDoc(ch.key, merged); changed = true; }
        if (merged !== ch.value) Outbox.add(ch.key);
      }
      Local.set('_cursor', String(res.cursor || 0));
      if (!res.more && !Outbox.list().length) break;
    }
    SyncState.status = Outbox.list().length ? 'pending' : 'ok';
  } catch (e) {
    SyncState.status = e.status === 401 ? 'auth' : (e.status ? 'error' : 'offline');
    scheduleSync(30000);
  } finally {
    SyncState.running = false;
    updateSyncPill();
    if (changed) render();
    if (SyncState.again) { SyncState.again = false; scheduleSync(500); }
  }
}

function syncText() {
  const n = Outbox.list().length;
  const waiting = n ? ` · ${n} ${n === 1 ? 'зміна чекає' : n < 5 ? 'зміни чекають' : 'змін чекають'}` : '';
  switch (SyncState.status) {
    case 'local': return '';
    case 'syncing': return '⟳ Синхронізація…';
    case 'offline': return `📴 Немає зв'язку${waiting} — дані на телефоні`;
    case 'error': return `⚠ Сервер недоступний${waiting} — дані на телефоні`;
    case 'auth': return '⚠ Відкрийте трекер заново з Telegram';
    default: return n ? `⟳ Зберігаю${waiting}` : '✓ Збережено';
  }
}

function updateSyncPill() {
  const text = syncText();
  const warn = ['offline', 'error', 'auth'].includes(SyncState.status);
  document.querySelectorAll('.sync').forEach((el) => {
    if (el.textContent !== text) el.textContent = text;
    el.classList.toggle('warn', warn);
  });
}

// ---------- Week numbering: Mon-Sun weeks counted from TEAM_W0, reports per 4 weeks ----------
function weekNo(date) {
  const w0 = parseIso(TEAM_W0);
  const n = Math.round((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate())
    - Date.UTC(w0.getFullYear(), w0.getMonth(), w0.getDate())) / 86400000);
  return Math.floor(n / 7) + 1;
}

// ---------- First start, previous version ----------
const DARINA_ID = '416042979';   // her projects were set up in advance; everyone else starts empty

function seedDefaults() {
  // lowest timestamps — real data from the server (another device) always wins
  meta = Object.assign(defaultMeta(), { name: tgName(), u: 1, ru: 1, mig: 1 });
  projects.clear();
  if (UID !== DARINA_ID) {
    rebuildIndex();
    putDoc('meta', JSON.stringify(meta));
    return;
  }
  // the same ids on every device of hers
  let id = 1;
  DEFAULT_PROJECTS.forEach((name, i) => {
    const pid = id++;
    const tasks = (i === 6 ? [TEXTS_TASK] : DEFAULT_TASKS).map((t) => [id++, t]);
    projects.set(pid, { id: pid, n: name, c: i, r: '', t: tasks, u: 1 });
    meta.order.push(pid);
  });
  rebuildIndex();
  putDoc('meta', JSON.stringify(meta));
  for (const p of projects.values()) putDoc('p' + p.id, JSON.stringify(projectDoc(p)));
}

/** Old "Проект N" names get the real names once; an untouched 7th project keeps only "Написання текстів". */
function migrateDefaults() {
  if (meta.mig >= 1 || UID !== DARINA_ID) return;   // everyone else keeps their data exactly as it is
  meta.order.forEach((pid, i) => {
    const p = projects.get(pid);
    if (!p || i >= DEFAULT_PROJECTS.length) return;
    if (/^Проект \d+$/.test(p.n)) p.n = DEFAULT_PROJECTS[i];
    const untouched7th = i === 6 && p.t.length === 3 && p.t.every(([, n], k) => n === DEFAULT_TASKS[k]);
    if (untouched7th) p.t = [[newId(), TEXTS_TASK]];
    saveProject(p);
  });
  meta.mig = 1;
  saveMeta();
}

function loadFromPhone() {
  const m = parseJSON(Local.get('meta'), null);
  if (!m || !Array.isArray(m.order)) return false;
  meta = Object.assign(defaultMeta(), m);
  projects.clear();
  for (const key of Local.docKeys()) {
    if (!/^p\d+$/.test(key)) continue;
    const p = parseJSON(Local.get(key), null);
    if (p && Array.isArray(p.t)) projects.set(+key.slice(1), Object.assign({ id: +key.slice(1) }, p));
  }
  days.clear();
  rebuildIndex();
  return true;
}

const withTimeout = (promise, ms, fallback) =>
  Promise.race([promise, new Promise((resolve) => setTimeout(() => resolve(fallback), ms))]);

/** Data of the previous version (phone cache + Telegram cloud) becomes the new format. */
async function migrateFromV2() {
  const oldLocal = (k) => { try { return localStorage.getItem('tracker2:' + k); } catch (e) { return null; } };
  const keys = new Set();
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('tracker2:')) keys.add(k.slice(9));
    }
  } catch (e) {}
  const cloud = {};
  if (supports('6.9')) {
    const cloudKeys = await withTimeout(new Promise((res) => W.CloudStorage.getKeys((err, v) => res(err ? [] : v || []))), 4000, []);
    const wanted = cloudKeys.filter((k) => k === 'meta' || /^p\d+$/.test(k) || /^e\d{8}$/.test(k));
    for (let i = 0; i < wanted.length; i += 50) {
      const chunk = wanted.slice(i, i + 50);
      Object.assign(cloud, await withTimeout(new Promise((res) => W.CloudStorage.getItems(chunk, (err, v) => res(err ? {} : v || {}))), 4000, {}));
    }
    wanted.forEach((k) => keys.add(k));
  }
  const read = (k) => cloud[k] || oldLocal(k);
  const old = parseJSON(read('meta'), null);
  if (!old || !Array.isArray(old.order)) return false;

  meta = Object.assign(defaultMeta(), {
    order: old.order, name: old.name || tgName(), role: old.role || 'Лід', run: old.run || null, u: 1, ru: 1, mig: old.mig || 0,
  });
  projects.clear();
  for (const id of old.order) {
    const p = parseJSON(read('p' + id), null);
    if (p && Array.isArray(p.t)) {
      projects.set(id, { id, n: p.n, c: p.c || 0, r: p.r || '', t: p.t.map(([tid, name]) => [tid, name]), u: 1 });
    }
  }
  meta.order = meta.order.filter((id) => projects.has(id));
  rebuildIndex();
  putDoc('meta', JSON.stringify(meta));
  for (const p of projects.values()) putDoc('p' + p.id, JSON.stringify(projectDoc(p)));
  for (const key of keys) {
    if (!/^e\d{8}$/.test(key)) continue;
    const rows = parseJSON(read(key), []);
    if (!rows.length) continue;
    putDoc(key, JSON.stringify(rows.map(([t, k, off, dur]) => [stableId(`${key}|${t}|${k}|${off}|${dur}`), t, k, off, dur, 1])));
  }
  return true;
}

// ---------- Actions ----------
async function startTimer(t, k) {
  const now = Date.now();
  const r = meta.run;
  if (r && r.t === t && r.k === k) {
    await stopAt(now);
    haptic('medium');
  } else {
    if (r) await stopAt(now);
    meta.run = { t, k, s: now };
    saveRun();
    haptic('heavy');
  }
  render();
}

async function stopAt(endMs) {
  const r = meta.run;
  if (!r) return;
  meta.run = null;
  saveRun();
  if (taskIndex.has(r.t)) await addInterval(r.t, r.k, r.s, Math.max(endMs, r.s));
}

// ---------- Formatting ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function clock(total) {
  total = Math.max(0, Math.floor(total));
  const h = Math.floor(total / 3600), m = Math.floor(total % 3600 / 60), s = total % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function short(total) {
  const minutes = Math.floor(Math.max(0, total) / 60);
  const h = Math.floor(minutes / 60), m = minutes % 60;
  if (!h) return `${m} хв`;
  return m ? `${h} год ${m} хв` : `${h} год`;
}
const hm = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const localInput = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${hm(ms)}`; };
const weekdayDate = (d) => d.toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'long' });
const colorOf = (pid) => COLORS[((projects.get(pid) || {}).c || 0) % COLORS.length];
const taskLabel = (tid) => { const t = taskIndex.get(tid); return t ? t.name + (t.del ? ' (видалено)' : '') : 'Завдання'; };
const projectName = (pid) => { const p = projects.get(pid); return p ? p.n + (p.x ? ' (видалено)' : '') : 'Проєкт'; };

let toastTimer = null;
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3500);
}

function tick() {
  const now = Date.now();
  const te = entriesOf(new Date(now), now);
  const he = view === 'history' && historyDay ? entriesOf(historyDay, now) : [];
  const pidOf = (x) => taskIndex.get(x.t).pid;
  const r = meta.run && taskIndex.has(meta.run.t) ? meta.run : null;

  for (const el of document.querySelectorAll('[data-live]')) {
    const [kind, a, b] = el.dataset.live.split(':');
    let text = '';
    if (kind === 'today-total') text = short(sumOf(te, () => true));
    else if (kind === 'proj') text = short(sumOf(te, (x) => pidOf(x) === +a));
    else if (kind === 'tk') {
      const seconds = sumOf(te, (x) => x.t === +a && x.k === +b);
      text = r && r.t === +a && r.k === +b ? clock(seconds) : short(seconds);
    }
    else if (kind === 'bar') text = r ? clock((now - r.s) / 1000) : '';
    else if (kind === 'h-p') text = short(sumOf(he, (x) => pidOf(x) === +a));
    else if (kind === 'h-total') text = short(sumOf(he, () => true));
    else if (kind === 'run-dur') text = r ? short((now - r.s) / 1000) : '';
    if (el.textContent !== text) el.textContent = text;
  }

  const shouldWarn = !!(r && now - r.s > FORGOTTEN_AFTER);
  const slot = $('banner-slot');
  if (slot && shouldWarn !== !!slot.firstChild) renderBanner(now);
  if (!!r !== !$('bar').hidden) render();
}

function confirmThen(message, action) {

function swatchesHtml(selected) {

// Project / task pickers shared by the entry and running-timer editors.

function pickerHtml(tid) {

function wirePicker(tid, kind, pidFallback) {
  const info = taskIndex.get(tid);
  const fill = () => {
    const p = projects.get(+$('f-project').value);
    $('f-task').innerHTML = p
      ? p.t.filter((x) => !x[2] || x[0] === tid).map(([id, n, del]) => `<option value="${id}">${esc(n + (del ? ' (видалено)' : ''))}</option>`).join('')

function minutesOf(value) { const [h, m] = value.split(':').map(Number); return h * 60 + m; }

function openEntryEditor(day, index) {
  const dayStart = startOfDay(day).getTime();
  const list = loadDay(dayKey(day));
  const existing = index != null ? list[index] : null;
  const now = Date.now();
  let s, e;
  if (existing) { s = existing.s; e = existing.e; }
  else if (dayKey(day) === dayKey(new Date(now))) { e = now; s = Math.max(dayStart, now - 3600 * 1000); }
  else { s = dayStart + 12 * 3600 * 1000; e = s + 3600 * 1000; }
  const endValue = e >= dayStart + 86400 * 1000 - 500 ? '00:00' : hm(e);

  openSheet(existing ? 'Запис' : 'Новий запис', `
    ${pickerHtml(existing ? existing.t : null)}
    <div class="group" style="margin-top:12px">
      <label class="field"><span>Початок</span><input type="time" id="f-start" value="${hm(s)}"></label>
      <label class="field"><span>Кінець</span><input type="time" id="f-end" value="${endValue}"></label>
    </div>
    <p class="note" id="f-note"></p>
    <div class="actions"><button class="btn-cancel" id="f-cancel">Скасувати</button><button class="btn-save" id="f-save">Зберегти</button></div>
    ${existing ? '<button class="btn-danger" id="f-delete">Видалити запис</button>' : ''}`,
  (sheet) => {
    wirePicker(existing ? existing.t : null, existing ? existing.k : 0, curPid);
    const read = () => {
      const st = $('f-start').value, en = $('f-end').value;
      if (!st || !en) return null;
      return {
        start: dayStart + minutesOf(st) * 60000,
        end: en === '00:00' && st !== '00:00' ? dayStart + 86400 * 1000 : dayStart + minutesOf(en) * 60000,
      };
    };
    const validate = () => {
      const v = read();
      let error = '';
      if (!$('f-task').value) error = 'У цьому проєкті немає завдань.';
      else if (!v) error = 'Вкажіть початок і кінець.';
      else if (v.end <= v.start) error = 'Кінець має бути пізніше за початок.';
      else if (v.end > Date.now() + 60000) error = 'Кінець не може бути в майбутньому.';
      $('f-note').classList.toggle('err', !!error);
      $('f-note').textContent = error || `Тривалість: ${short((v.end - v.start) / 1000)}. «00:00» у кінці — до півночі.`;
      $('f-save').disabled = !!error;
      return error ? null : v;
    };
    sheet.addEventListener('input', validate);
    sheet.addEventListener('change', validate);
    validate();
    $('f-cancel').onclick = closeSheet;
    $('f-save').onclick = () => {
      const v = validate();
      if (!v) return;
      const changes = { t: +$('f-task').value, k: +$('f-kind').value, s: v.start, e: v.end, u: nowSec() };
      if (existing) Object.assign(existing, changes);
      else loadDay(dayKey(day)).push(Object.assign({ id: newId(), x: 0 }, changes));
      saveDay(dayKey(day));
      haptic('success');
      closeSheet();
      render();
    };
    if (existing) $('f-delete').onclick = () => confirmThen('Видалити запис?', () => {
      existing.x = 1;          // kept as a deletion mark so other devices delete it too
      existing.u = nowSec();
      saveDay(dayKey(day));
      haptic('warning');
      closeSheet();
      render();
    });
  });
}

    <button class="btn-danger" id="r-discard">Не враховувати цей таймер</button>`,

    $('r-cancel').onclick = closeSheet;

      if (!$('f-task').value) return showNote('Виберіть завдання.');

// ---------- Excel export ----------
// Reports cover periods of 4 consecutive Mon-Sun weeks counted from TEAM_W0, not calendar months.
let expPeriod = 1;
let expToken = 0;

const periodOf = (date) => Math.max(1, Math.floor((weekNo(date) - 1) / PERIOD_WEEKS) + 1);
const periodStart = (n) => addDays(parseIso(TEAM_W0), (n - 1) * PERIOD_WEEKS * 7);
const dm = (d) => `${d.getDate()}.${pad(d.getMonth() + 1)}`;
const dmRu = (d) => d.toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' });

function toB64Url(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = '';
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

/**
 * Minutes per task / kind / week for one 4-week period. Deleted tasks and projects appear
 * only when they have time in the period. Must match periodPayload() on the server.
 */
async function buildPayload(n) {
  const start = periodStart(n);
  const dayList = Array.from({ length: PERIOD_WEEKS * 7 }, (_, i) => addDays(start, i));
  const now = Date.now();
  const nw = PERIOD_WEEKS;
  const wr = Array.from({ length: nw }, (_, w) => `${dm(dayList[w * 7])}–${dm(dayList[w * 7 + 6])}`);
  const zeros = () => Array(nw).fill(0);

  const acc = new Map();
  dayList.forEach((day, i) => {
    const week = Math.floor(i / 7);
    for (const x of entriesOf(day, now)) {
      if (!acc.has(x.t)) acc.set(x.t, { w: zeros(), e: zeros() });
      acc.get(x.t)[x.k ? 'e' : 'w'][week] += (x.e - x.s) / 1000;
    }
  });
  const toMin = (a) => a.map((s) => Math.round(s / 60));
  const out = [];
  for (const pid of meta.order) {
    const p = projects.get(pid);
    if (!p) continue;
    const hasTime = p.t.some(([tid]) => acc.has(tid));
    if (p.x && !hasTime) continue;
    out.push({
      n: p.x ? `${p.n} (видалено)` : p.n,
      r: p.r || meta.role || '',
      t: p.t.filter(([tid, , del]) => !del || acc.has(tid)).map(([tid, name, del]) => {
        const a = acc.get(tid) || { w: zeros(), e: zeros() };
        return { n: del ? `${name} (видалено)` : name, w: toMin(a.w), e: toMin(a.e) };
      }),
    });
  }
  return {
    pn: n, from: isoDate(start), to: isoDate(dayList[dayList.length - 1]), at: now,
    name: meta.name || tgName(), role: meta.role || '', nw, wr, p: out,
  };
}

function openExport() {
  expPeriod = periodOf(new Date());
  openSheet('Excel-таблиця', '<div id="exp-body"></div>', renderExport);
}

async function renderExport() {
  const token = ++expToken;
  const body = $('exp-body');
  if (!body) return;
  const current = periodOf(new Date());
  const start = periodStart(expPeriod);
  const end = addDays(start, PERIOD_WEEKS * 7 - 1);
  const switcher = `<div class="switcher">
    <button id="x-prev" aria-label="Попередній період" ${expPeriod <= 1 ? 'disabled' : ''}>‹</button>
    <div class="title"><b>Період ${expPeriod}</b><span>${esc(dmRu(start))} – ${esc(dmRu(end))}${expPeriod === current ? ' · зараз' : ''}</span></div>
    <button id="x-next" aria-label="Наступний період" ${expPeriod >= current ? 'disabled' : ''}>›</button></div>`;
  body.innerHTML = `${switcher}<p class="note">Рахую…</p>`;
  const wire = () => {
    $('x-prev').onclick = () => { expPeriod = Math.max(1, expPeriod - 1); renderExport(); };
    $('x-next').onclick = () => { expPeriod = Math.min(current, expPeriod + 1); renderExport(); };
  };
  wire();

  const payload = await buildPayload(expPeriod);
  if (token !== expToken || !$('exp-body')) return;
  const total = (p) => p.t.reduce((a, t) => a + t.w.reduce((x, y) => x + y, 0) + t.e.reduce((x, y) => x + y, 0), 0);
  const all = payload.p.reduce((a, p) => a + total(p), 0);
  body.innerHTML = `${switcher}
    <div class="group">
      ${payload.p.map((p) => `<div class="row"><span class="grow"><div>${esc(p.n)}</div></span><span class="val num">${short(total(p) * 60)}</span></div>`).join('')}
      <div class="row total"><span class="grow">Всього за 4 тижні</span><span class="val num">${short(all * 60)}</span></div>
    </div>
    <p class="note">Таблиця відкриється в браузері телефона — там натисніть «Завантажити». У ній 4 колонки «Тиж. 1–4» — тижні цього періоду (пн–нд), окремо «Робота» і «Правки». Час у форматі ГОД.ХВ, як у вашому зразку. Після кожного періоду бот сам надішле звіт у чат.</p>
    <button class="primary" id="x-open">Відкрити таблицю</button>`;
  wire();
  $('x-open').onclick = () => {
    const url = new URL('export.html?v=' + APP_VERSION, location.href).href + '#' + toB64Url(payload);
    if (inTelegram && W.openLink) W.openLink(url); else window.open(url, '_blank');
  };
}

      // a new phone: data may already exist on the server (another device), so ask it first
      if (inTelegram) {
        $('app').innerHTML = '<p class="hint">Завантажую дані…</p>';
        await withTimeout(syncNow(), 8000, null);
      }
      if (!loadFromPhone()) seedDefaults();
    }
  }
  if (!meta.name && tgName()) { meta.name = tgName(); saveMeta(); }
  migrateDefaults();
  render();

  setInterval(tick, 1000);
  setInterval(syncNow, 60000);
  window.addEventListener('online', () => syncNow());
  window.addEventListener('offline', () => { SyncState.status = 'offline'; updateSyncPill(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); syncNow(); } });
  syncNow();
  askWriteAccess();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  checkForUpdate();
}

init();
</script>
</body>
</html>
