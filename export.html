<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excel-таблица</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root { --bg: #f2f2f7; --card: #fff; --text: #000; --hint: #8e8e93; --accent: #0a84ff; --sep: rgba(127,127,127,.2); }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #fff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 24px; margin: 8px 0 4px; }
  .sub { color: var(--hint); margin: 0 0 18px; }
  .group { background: var(--card); border-radius: 16px; overflow: hidden; }
  .row { display: flex; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--sep); align-items: baseline; }
  .row:first-child { border-top: 0; }
  .row .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .v { color: var(--hint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row.total { font-weight: 700; }
  .row.total .v { color: var(--text); }
  button { display: block; width: 100%; margin-top: 14px; padding: 16px; border: 0; border-radius: 14px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
  button.alt { background: var(--card); color: var(--accent); }
  button:disabled { opacity: .5; }
  .note { color: var(--hint); font-size: 14px; margin-top: 14px; }
  .err { color: #ff3b30; }
</style>
</head>
<body>
<main>
  <h1>Excel-таблица</h1>
  <p class="sub" id="sub"></p>
  <div class="group" id="summary"></div>
  <button id="download" disabled>Скачать .xlsx</button>
  <button id="share" class="alt" hidden>Поделиться файлом</button>
  <p class="note" id="note"></p>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const short = (min) => { const h = Math.floor(min / 60), m = min % 60; return h ? (m ? `${h} ч ${m} мин` : `${h} ч`) : `${m} мин`; };
const sum = (a) => a.reduce((x, y) => x + y, 0);

function decode(hash) {
  const b64 = hash.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

function fail(text) {
  $('note').className = 'note err';
  $('note').textContent = text;
}

/** The builder is loaded with the app version in its URL, so a stale cached copy is never used. */
function loadScript(src) {
  return new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = resolve;
    document.head.appendChild(s);
  });
}

(async function main() {
  await loadScript('xlsx-build.js?v=' + encodeURIComponent(new URLSearchParams(location.search).get('v') || Date.now()));
  let data;
  try {
    data = decode(location.hash.slice(1));
    if (!data || !Array.isArray(data.p)) throw new Error('bad data');
  } catch (e) {
    return fail('Нет данных для таблицы. Откройте эту страницу кнопкой «Excel» в приложении.');
  }

  const isoToText = (s) => s.split('-').reverse().join('.');
  const periodName = data.pn
    ? `Период ${data.pn}: ${isoToText(data.from)} – ${isoToText(data.to)}`
    : `${MONTHS[data.m - 1]} ${data.y}`;
  $('sub').textContent = periodName;
  document.title = `Трекер · ${periodName}`;

  let all = 0;
  $('summary').innerHTML = data.p.map((p) => {
    const t = sum(p.t.map((x) => sum(x.w) + sum(x.e)));
    all += t;
    return `<div class="row"><span class="n">${esc(p.n)}</span><span class="v">${short(t)}</span></div>`;
  }).join('') + `<div class="row total"><span class="n">${data.pn ? 'Всего за 4 недели' : 'Всего за месяц'}</span><span class="v">${short(all)}</span></div>`;

  if (typeof ExcelJS === 'undefined' || !window.TrackerXlsx) {
    return fail('Не удалось загрузить библиотеку Excel. Проверьте интернет и обновите страницу.');
  }

  const fileName = data.pn
    ? `Трекер_период-${data.pn}_${data.from}.xlsx`
    : `Трекер_${data.y}-${String(data.m).padStart(2, '0')}.xlsx`;
  let file;
  try {
    const buffer = await TrackerXlsx.buildWorkbook(ExcelJS, data).xlsx.writeBuffer();
    file = new File([buffer], fileName, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  } catch (e) {
    console.error(e);
    return fail('Не получилось собрать таблицу: ' + e.message);
  }

  $('download').disabled = false;
  $('download').onclick = () => {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  };

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    $('share').hidden = false;
    $('share').onclick = () => navigator.share({ files: [file], title: fileName }).catch(() => {});
  }
  $('note').textContent = 'Таблица готова. Нажмите «Скачать», затем откройте файл в Excel, Numbers или Google Таблицах. «Поделиться» отправит файл, например, в Telegram.';
  window.__ready = { fileName, size: file.size };
})();
</script>
</body>
</html>
